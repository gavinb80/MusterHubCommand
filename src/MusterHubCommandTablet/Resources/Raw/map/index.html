<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="leaflet.js"></script>
  <script>
    // Bundled, not fetched -- the whole page (this HTML, Leaflet's JS/CSS,
    // the default marker images) ships inside the app itself, per the
    // "no web app" constraint appliance tablets enforce. Only the tile
    // images themselves come over the network at runtime, the same as any
    // native map SDK would do -- nothing here is a browser loading an
    // arbitrary site.
    var params = new URLSearchParams(window.location.search);
    var lat = parseFloat(params.get("lat"));
    var lng = parseFloat(params.get("lng"));

    var map = L.map("map", { attributionControl: true }).setView([lat, lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19,
    }).addTo(map);
    L.marker([lat, lng]).addTo(map);
  </script>
</body>
</html>
